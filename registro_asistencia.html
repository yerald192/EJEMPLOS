<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGISTRO DE ASISTENCIA</title>
    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <form id="formAsistencia">
        <h1 id="titulo">REGISTRO DE ASISTENCIA</h1>

        <!--CAMPO 1-->
        <div class="formulario">
            <label for="fecha">FECHA</label><br>
            <input type="text" id="fecha" name="fecha">
        </div><br>

        <!--CAMPO 2-->
        <div class="formulario">
            <label for="codigo_curso">CODIGO DEL CURSO</label><br>
            <input type="text" id="codigo_curso" name="codigo_curso">
        </div><br>

        <!--CAMPO 3-->
        <div class="formulario">
            <label for="docente">DOCENTE</label><br>
            <input type="text" id="docente" name="docente">
        </div><br>

        <!--CAMPO 4-->
        <div class="formulario">
            <label for="dni_alumno">DNI DEL ALUMNO</label><br>
            <input type="text" id="dni_alumno" name="dni_alumno">
        </div><br>

        <!--CAMPO 5-->
        <div class="formulario">
            <label for="nombre_alumno">NOMBRE DEL ALUMNO</label><br>
            <input type="text" id="nombre_alumno" name="nombre_alumno">
        </div><br>

        <!--CAMPO 6-->
        <div class="formulario">
            <label for="estado_asistencia">ESTADO DE ASISTENCIA</label><br>
            <select id="estado_asistencia" name="estado_asistencia">
                <option value="presente">PRESENTE</option>
                <option value="tardanza">TARDANZA</option>
                <option value="falta_injustificada">FALTA INJUSTIFICADA</option>
                <option value="falta_justificada">FALTA JUSTIFICADA</option>
            </select>
        </div><br>

        <!--CAMPO 7-->
        <div class="formulario">
            <label for="hora_llegada">HORA DE REGISTRO</label><br>
            <input type="text" id="hora_llegada" name="hora_llegada">
        </div><br>

        <!--CAMPO 8-->
        <div class="formulario">
            <label for="sesion">NUMERO DE SESION / TEMA</label><br>
            <input type="text" id="sesion" name="sesion">
        </div><br>

        <!--CAMPO 9-->
        <div class="formulario">
            <label for="observaciones">OBSERVACIONES</label><br>
            <input type="text" id="observaciones" name="observaciones">
        </div><br>

        <!--CAMPO 10-->
        <div class="formulario">
            <label for="registrador">REGISTRADO POR</label><br>
            <input type="text" id="registrador" name="registrador">
        </div><br>

        <button type="submit">Guardar</button>
    </form>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
