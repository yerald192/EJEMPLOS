<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGISTRO DE PRACTICAS</title>
    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <form id="formPractica">
        <h1 id="titulo">REGISTRO DE PRACTICAS PRE-PROFESIONALES</h1>

        <!--CAMPO 1-->
        <div class="formulario">
            <label for="dni_estudiante">DNI DEL ESTUDIANTE</label><br>
            <input type="text" id="dni_estudiante" name="dni_estudiante">
        </div><br>

        <!--CAMPO 2-->
        <div class="formulario">
            <label for="nombre_estudiante">NOMBRES Y APELLIDOS DEL ESTUDIANTE</label><br>
            <input type="text" id="nombre_estudiante" name="nombre_estudiante">
        </div><br>

        <!--CAMPO 3-->
        <div class="formulario">
            <label for="carrera">CARRERA PROFESIONAL</label><br>
            <select id="carrera" name="carrera">
                <option value="diseno_web">DISEÑO WEB</option>
                <option value="ing_software">ING. SOFTWARE</option>
                <option value="ing_sistemas">ING. SISTEMAS</option>
                <option value="computacion">COMPUTACION E INFORMATICA</option>
            </select>
        </div><br>

        <!--CAMPO 4-->
        <div class="formulario">
            <label for="empresa">EMPRESA / INSTITUCION</label><br>
            <input type="text" id="empresa" name="empresa">
        </div><br>

        <!--CAMPO 5-->
        <div class="formulario">
            <label for="ruc">RUC DE LA EMPRESA</label><br>
            <input type="text" id="ruc" name="ruc">
        </div><br>

        <!--CAMPO 6-->
        <div class="formulario">
            <label for="area">AREA DE DESEMPEÑO</label><br>
            <input type="text" id="area" name="area">
        </div><br>

        <!--CAMPO 7-->
        <div class="formulario">
            <label for="supervisor">JEFE INMEDIATO / SUPERVISOR</label><br>
            <input type="text" id="supervisor" name="supervisor">
        </div><br>

        <!--CAMPO 8-->
        <div class="formulario">
            <label for="telefono_supervisor">TELEFONO DEL SUPERVISOR</label><br>
            <input type="text" id="telefono_supervisor" name="telefono_supervisor">
        </div><br>

        <!--CAMPO 9-->
        <div class="formulario">
            <label for="fecha_inicio">FECHA DE INICIO</label><br>
            <input type="text" id="fecha_inicio" name="fecha_inicio">
        </div><br>

        <!--CAMPO 10-->
        <div class="formulario">
            <label for="fecha_fin">FECHA DE FIN</label><br>
            <input type="text" id="fecha_fin" name="fecha_fin">
        </div><br>

        <!--CAMPO 11-->
        <div class="formulario">
            <label for="horas_totales">TOTAL DE HORAS A CUMPLIR</label><br>
            <input type="text" id="horas_totales" name="horas_totales">
        </div><br>

        <!--CAMPO 12-->
        <div class="formulario">
            <label for="modalidad">MODALIDAD DE PRACTICA</label><br>
            <select id="modalidad" name="modalidad">
                <option value="presencial">PRESENCIAL</option>
                <option value="remoto">REMOTO</option>
                <option value="hibrido">HIBRIDO</option>
            </select>
        </div><br>

        <button type="submit">Guardar</button>
    </form>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
